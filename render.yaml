# MariaDB edition: deploys ONLY the web/API service. Supply a separately hosted MariaDB URL.
# The previous managed PostgreSQL service is intentionally removed.
# Paid persistent disk/web service required. Review Render costs before applying.
services:
  - type: web
    name: muscle-dynamics
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: private-receipts
      mountPath: /var/data/muscle-dynamics
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      # Hosted MariaDB reachable by Render, mysql://... ; NOT local HeidiSQL/127.0.0.1.
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/muscle-dynamics
      - key: APP_URL
        sync: false
