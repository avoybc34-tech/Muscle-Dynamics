name: Build APK and unsigned IPA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: What should GitHub build?
        type: choice
        options: [both, android, ios]
        default: both
        required: true
      backend_url:
        description: Optional public HTTPS gym API origin (leave blank to connect inside app)
        type: string
        required: false
        default: ''
      acknowledge_test_builds:
        description: 'I understand: IPA is UNSIGNED, APK uses a test key, security findings remain. Testing only.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: muscle-dynamics-test-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: ${{ inputs.backend_url || vars.EXPO_PUBLIC_API_URL || '' }}
  ACK_TEST_BUILDS: ${{ inputs.acknowledge_test_builds }}

jobs:
  checks:
    name: Validate source and report security status
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Validate inputs (test builds only)
        run: node scripts/ci-config.mjs
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run doctor
      - name: Record unresolved advisories without unsafe automatic fixes
        run: node scripts/security-report.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: security-audit-and-status
          path: reports/
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android — installable TEST APK
    needs: checks
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev
      - name: Build release-mode APK using public test signing key
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Muscle-Dynamics-Android-TEST-APK
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Logs (including on failure)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iPhone — UNSIGNED IPA (not directly installable)
    needs: checks
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --include=dev
      - name: Build device archive WITHOUT Apple signing
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Muscle-Dynamics-iPhone-UNSIGNED-IPA
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Logs (including on failure)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
